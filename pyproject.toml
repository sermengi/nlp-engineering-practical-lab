[project]
name = "nlp-engineering-practical-lab"
version = "0.1.0"
description = "Practical lab workspace for NLP engineering."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic",
    "pyyaml",
]

[project.scripts]
nlp-lab = "nlp_lab.cli:main"

[dependency-groups]
core = [
    "numpy",
    "pandas",
    "rich",
]
ml = [
    "accelerate",
    "datasets",
    "evaluate",
    "scikit-learn",
    "torch",
    "transformers",
]
remote = [
    "modal",
]
development = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["nlp_lab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "accelerate.*",
    "datasets.*",
    "evaluate.*",
    "modal.*",
    "pandas.*",
    "sklearn.*",
    "torch.*",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast tests that require no internet, GPU, or model downloads",
    "integration: component tests that may download a small Hugging Face model and run on CPU",
    "smoke: end-to-end Modal tests that verify remote execution, artifact writes, and returned results",
]
